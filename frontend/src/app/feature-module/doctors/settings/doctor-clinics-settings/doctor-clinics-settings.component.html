<app-doctor-breadcrumb></app-doctor-breadcrumb>
<div class="content doctor-content">
  <div class="container">
    <div class="row">
      <app-doctor-sidebar class="col-md-5 col-lg-4 col-xl-3"></app-doctor-sidebar>
      <div class="col-lg-8 col-xl-9">
        <div class="dashboard-header">
          <h3>Profile Settings</h3>
        </div>
        <div class="setting-tab">
          <div class="appointment-tabs">
            <ul class="nav">
              <li class="nav-item"><a class="nav-link" [routerLink]="routes.doctorProfileSettings">Basic Details</a></li>
              <li class="nav-item"><a class="nav-link" [routerLink]="routes.doctorExperienceSettings">Experience</a></li>
              <li class="nav-item"><a class="nav-link" [routerLink]="routes.doctorEducationSettings">Education</a></li>
              <li class="nav-item"><a class="nav-link" [routerLink]="routes.doctorAwardsSettings">Awards</a></li>
              <li class="nav-item"><a class="nav-link" [routerLink]="routes.doctorInsuranceSettings">Insurances</a></li>
              <li class="nav-item"><a class="nav-link active" [routerLink]="routes.doctorClinicSettings">Clinics</a></li>
            </ul>
          </div>
        </div>

        <div class="setting-title d-flex align-items-center justify-content-between">
          <h5>Clinics</h5>
          <button type="button" class="btn btn-primary" (click)="addClinic()">Add New Clinic</button>
        </div>

        <div *ngIf="loading" class="alert alert-info">Loading...</div>
        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
        <div *ngIf="success" class="alert alert-success">{{ success }}</div>

        <form [formGroup]="form" (ngSubmit)="save()">
          <div class="setting-card" formArrayName="clinics">
            <div class="add-info membership-infos">
              <div class="row membership-content">
                <ng-container *ngFor="let cl of clinics.controls; let i = index" [formGroupName]="i">
                  <div class="col-lg-12">
                    <div class="setting-title d-flex align-items-center justify-content-between">
                      <h6 class="mb-0">Clinic {{ i + 1 }}</h6>
                      <a href="javascript:void(0);" class="text-danger" (click)="removeClinic(i)">Delete</a>
                    </div>
                  </div>
                  <div class="col-lg-6 col-md-6">
                    <div class="form-wrap">
                      <label class="col-form-label">Name <span class="text-danger">*</span></label>
                      <input type="text" class="form-control" formControlName="name" />
                    </div>
                  </div>
                  <div class="col-lg-6 col-md-6">
                    <div class="form-wrap">
                      <label class="col-form-label">City</label>
                      <input type="text" class="form-control" formControlName="city" />
                    </div>
                  </div>
                  <div class="col-lg-12">
                    <div class="form-wrap">
                      <label class="col-form-label">Address</label>
                      <input type="text" class="form-control" formControlName="address" />
                    </div>
                  </div>
                  <div class="col-lg-6 col-md-6">
                    <div class="form-wrap">
                      <label class="col-form-label">Fee Amount</label>
                      <input type="number" class="form-control" formControlName="fee_amount" />
                    </div>
                  </div>
                  <div class="col-12"><hr /></div>
                </ng-container>
              </div>
            </div>
          </div>

          <div class="modal-btn text-end">
            <button type="submit" class="btn btn-primary prime-btn" [disabled]="loading">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
