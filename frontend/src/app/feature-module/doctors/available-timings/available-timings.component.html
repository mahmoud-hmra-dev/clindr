<app-doctor-breadcrumb></app-doctor-breadcrumb>

<div class="content doctor-content">
  <div class="container">

    <div class="row">
      <app-doctor-sidebar class="col-md-5 col-lg-4 col-xl-3"></app-doctor-sidebar>

      <div class="col-lg-8 col-xl-9">

        <div class="card custom-card">
          <div class="card-body">
            <div class="dashboard-header d-flex justify-content-between align-items-center">
              <h3 class="mb-0">Available Timings</h3>
              <button class="btn btn-primary prime-btn" type="button" (click)="addSlot()">Add Slot</button>
            </div>

            <div *ngIf="loading" class="alert alert-info mt-3">Loading availabilities...</div>
            <div *ngIf="message" class="alert alert-success mt-3">{{ message }}</div>
            <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>

            <form [formGroup]="form" (ngSubmit)="save()" class="mt-3">
              <div formArrayName="availabilities">
                <div class="slot-box mb-3" *ngFor="let slot of availabilities.controls; let i = index" [formGroupName]="i">
                  <div class="slot-header d-flex justify-content-between align-items-center">
                    <h5>Slot {{ i + 1 }}</h5>
                    <button type="button" class="btn btn-link text-danger p-0" (click)="removeSlot(i)">Delete</button>
                  </div>
                  <div class="row g-3">
                    <div class="col-md-4">
                      <label class="form-label">Day of Week</label>
                      <select class="form-select" formControlName="day_of_week">
                        <option *ngFor="let d of dayOptions" [value]="d">{{ d | titlecase }}</option>
                      </select>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Start Time</label>
                      <input type="time" class="form-control" formControlName="start_time">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">End Time</label>
                      <input type="time" class="form-control" formControlName="end_time">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Slot Capacity</label>
                      <input type="number" class="form-control" formControlName="slot_capacity" min="1">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Fee Amount</label>
                      <input type="number" class="form-control" formControlName="fee_amount" min="0" step="0.01">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Clinic</label>
                      <select class="form-select" formControlName="clinic_id">
                        <option [ngValue]="null">Any Clinic</option>
                        <option *ngFor="let clinic of clinics" [ngValue]="clinic.id">{{ clinic.name }}</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
              <div class="text-end">
                <button type="submit" class="btn btn-primary prime-btn" [disabled]="saving">Save Changes</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
