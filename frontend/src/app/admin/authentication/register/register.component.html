<div class="main-wrapper login-body">
    <div class="login-wrapper">
        <div class="container">
            <div class="loginbox">
                <div class="login-left">
                    <img class="img-fluid" src="assets/clindoctor-logo.png" alt="Logo">
                </div>
                <div class="login-right">
                    <div class="login-right-wrap">
                        <h1>Register</h1>
                        <p class="account-subtitle">Access to our dashboard</p>

                        <!-- Form -->
                        <form>
                            <div class="mb-3">
                                <input class="form-control" type="text" placeholder="Name">
                            </div>
                            <div class="mb-3">
                                <input class="form-control" type="text" placeholder="Email">
                            </div>
                            <div class="mb-3">
                                <input class="form-control" type="text" placeholder="Password">
                            </div>
                            <div class="mb-3">
                                <input class="form-control" type="text" placeholder="Confirm Password">
                            </div>
                            <div class="mb-0">
                                <button class="btn btn-primary w-100" type="button" (click)="navigation()" (keydown)="navigation()" tabindex="1">Register</button>
                            </div>
                        </form>
                        <!-- /Form -->


                        <div class="text-center dont-have">Already have an account? <a [routerLink] = "routes.adminLogin">Login</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
