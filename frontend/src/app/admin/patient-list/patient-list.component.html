<div class="page-wrapper">
  <div class="content container-fluid">

    <!-- Page Header -->
    <div class="page-header">
      <div class="row">
        <div class="col-sm-12">
          <h3 class="page-title">List of Patient</h3>
          <ul class="breadcrumb">
            <li class="breadcrumb-item"><a [routerLink]="routes.adminDashboard">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="javascript:void(0)">Users</a></li>
            <li class="breadcrumb-item active">Patient</li>
          </ul>
        </div>
      </div>
    </div>
    <!-- /Page Header -->

    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <app-pagination-header></app-pagination-header>
              <table matSort (matSortChange)="sortData($event)"
                class="datatable table table-hover table-center mb-0">
                <thead>
                  <tr>
                    <th mat-sort-header="id">Patient ID</th>
                    <th mat-sort-header="fullName">Patient Name</th>
                    <th mat-sort-header="phone">Phone</th>
                    <th mat-sort-header="email">Email</th>
                    <th mat-sort-header="city">Location</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  @for (data of tableData; track data) {
                    <tr>
                      <td>{{data.id}}</td>
                      <td>
                        <h2 class="table-avatar">
                          <a [routerLink]="routes.adminProfile" class="avatar avatar-sm me-2"><img
                            class="avatar-img rounded-circle" src="assets/admin/img/patients/patient1.jpg"
                          alt="User Image"></a>
                          <a [routerLink]="routes.adminProfile">{{data.fullName}} </a>
                        </h2>
                      </td>
                      <td>{{data.phone}}</td>
                      <td>{{data.email}}</td>
                      <td>{{data.city}} <span *ngIf="data.country">({{data.country}})</span></td>
                      <td>
                        <button class="btn btn-sm btn-danger" type="button" (click)="deletePatient(data.id)">Delete</button>
                      </td>
                    </tr>
                  }
                </tbody>
              </table>
            </div>
            <app-custom-pagination></app-custom-pagination>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
