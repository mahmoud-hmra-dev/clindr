services:
  mysql_backend:
    image: mysql:8.0
    container_name: clindoctor-mysql-backend
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: clindoctor
      MYSQL_USER: clindoctor
      MYSQL_PASSWORD: clindoctorpass
    ports:
      - "3307:3306"
    volumes:
      - db_backend:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql_payment:
    image: mysql:8.0
    container_name: clindoctor-mysql-payment
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: clindoctor_payment
      MYSQL_USER: clindoctor
      MYSQL_PASSWORD: clindoctorpass
    ports:
      - "3308:3306"
    volumes:
      - db_payment:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: clindoctor-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql_backend
      - mysql_payment
      - mysql_call
    environment:
      PMA_HOSTS: mysql_backend,mysql_payment,mysql_call
      PMA_USER: clindoctor
      PMA_PASSWORD: clindoctorpass
    ports:
      - "8080:80"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: clindoctor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mysql_backend:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql_backend
      DB_PORT: 3306
      DB_DATABASE: clindoctor
      DB_USERNAME: clindoctor
      DB_PASSWORD: clindoctorpass
    volumes:
      - backend_storage:/var/www/html/storage

  websocket:
    build:
      context: ./backend
      dockerfile: ../docker/websocket/Dockerfile
    container_name: clindoctor-websocket
    restart: unless-stopped
    ports:
      - "6001:6001"
    environment:
      WS_PORT: 6001

  payment:
    build:
      context: ./payment
      dockerfile: ../docker/payment/Dockerfile
    container_name: clindoctor-payment
    restart: unless-stopped
    ports:
      - "8001:8000"
    depends_on:
      mysql_payment:
        condition: service_healthy
    env_file:
      - ./payment/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql_payment
      DB_PORT: 3306
      DB_DATABASE: clindoctor_payment
      DB_USERNAME: clindoctor
      DB_PASSWORD: clindoctorpass
    volumes:
      - payment_storage:/var/www/html/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: clindoctor-frontend
    ports:
      - "4200:80"
    restart: unless-stopped
    depends_on:
      - backend
      - payment

  mirotalk:
    build:
      context: ./call
      dockerfile: Dockerfile
    image: clindoctorcall/p2p:local
    container_name: mirotalk
    hostname: mirotalk
    depends_on:
      mysql_call:
        condition: service_healthy
    volumes:
      - ./.env:/src/.env:ro
    restart: unless-stopped
    ports:
      - "8082:3000"

  mysql_call:
    image: mysql:8.0
    container_name: clindoctor-mysql-call
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: clindoctor_call
      MYSQL_USER: clindoctor
      MYSQL_PASSWORD: clindoctorpass
    ports:
      - "3309:3306"
    volumes:
      - db_call:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_backend:
  db_payment:
  backend_storage:
  payment_storage:
  db_call:
