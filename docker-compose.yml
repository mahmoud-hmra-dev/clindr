version: "3.9"

services:
  # MySQL الخاص بالـ BACKEND
  mysql_backend:
    image: mysql:8.0
    container_name: clindoctor-mysql-backend
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: clindoctor
      MYSQL_USER: clindoctor
      MYSQL_PASSWORD: clindoctorpass
    ports:
      - "3307:3306"
    volumes:
      - db_backend:/var/lib/mysql

  # MySQL الخاص بالـ PAYMENT
  mysql_payment:
    image: mysql:8.0
    container_name: clindoctor-mysql-payment
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: clindoctor_payment
      MYSQL_USER: clindoctor
      MYSQL_PASSWORD: clindoctorpass
    ports:
      - "3308:3306"
    volumes:
      - db_payment:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: clindoctor-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql_backend
      - mysql_payment
    environment:
      PMA_HOSTS: mysql_backend,mysql_payment
      PMA_USER: clindoctor
      PMA_PASSWORD: clindoctorpass
    ports:
      - "8080:80"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: clindoctor-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - mysql_backend
    command: sh -c "composer install && php artisan migrate --seed --force && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql_backend
      DB_PORT: 3306
      DB_DATABASE: clindoctor
      DB_USERNAME: clindoctor
      DB_PASSWORD: clindoctorpass

  payment:
    build:
      context: ./payment
      dockerfile: ../docker/payment/Dockerfile
    container_name: clindoctor-payment
    working_dir: /var/www/html
    volumes:
      - ./payment:/var/www/html
    ports:
      - "8001:8000"
    depends_on:
      - mysql_payment
    command: sh -c "composer install && php artisan migrate --seed --force && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      DB_CONNECTION: mysql
      DB_HOST: mysql_payment
      DB_PORT: 3306
      DB_DATABASE: clindoctor_payment
      DB_USERNAME: clindoctor
      DB_PASSWORD: clindoctorpass

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: clindoctor-frontend
    working_dir: /usr/src/app
    volumes:
      - ./frontend:/usr/src/app
    ports:
      - "4200:4200"
    command: sh -c "npm install --force && npm run start -- --host 0.0.0.0 --port 4200"

volumes:
  db_backend:
  db_payment:
